<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUMBO SOUND - WAP & WEB RINTONES 2000</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap');

        body {
            background-color: #000080;
            background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
            color: #00ff00;
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .marquee-container {
            background: #ffff00;
            color: #ff0000;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            padding: 8px;
            border: 2px dashed #ff00ff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #c0c0c0;
            border: 4px outset #ffffff;
            padding: 15px;
            color: #000000;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            color: #ff00ff;
            text-shadow: 2px 2px #00ffff, 4px 4px #ff0000;
            transform: skew(-5deg);
            margin-bottom: 10px;
        }

        .sub-title {
            font-size: 14px;
            color: #800080;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .counter {
            background: #000;
            color: #00ff00;
            font-size: 20px;
            padding: 4px;
            border: 2px inset #ffffff;
            margin-bottom: 15px;
        }

        .screen {
            background: #ffffff;
            border: 3px inset #808080;
            padding: 10px;
            min-height: 90px;
            margin-bottom: 15px;
            font-size: 18px;
            text-align: left;
            color: #000;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        button {
            background: #dfdfdf;
            border: 3px outset #ffffff;
            font-family: 'VT323', monospace;
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
            cursor: pointer;
            color: #000;
        }

        button:active {
            border: 3px inset #ffffff;
            background: #cfcfcf;
        }

        .btn-action {
            background: #ff00ff;
            color: #ffff00;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            width: 100%;
            padding: 12px;
            border: 3px outset #ffff00;
            cursor: pointer;
        }

        .sms-btn {
            background: #00ff00;
            color: #000;
            margin-top: 10px;
            display: none;
            text-decoration: none;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            padding: 10px;
            border: 3px outset #ffffff;
            text-align: center;
        }

        .preview-box {
            margin-top: 15px;
            border: 2px solid #ff0000;
            background: #000;
            padding: 8px;
            display: none;
            color: #00ff00;
        }

        .preview-box img {
            max-width: 100%;
            height: auto;
            border: 1px dashed #00ff00;
        }

        .blink {
            animation: blinker 0.6s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="marquee-container">
    <marquee>*** PORTALE WAP 100% GRATIS! SCARICA TOPOLONA, CRAZY FROG E SQUILLI SENZA ABBONAMENTO! ***</marquee>
</div>

<div class="container">
    <h1>JUMBO TONE 2000</h1>
    <div class="sub-title">~* IL REGNO DEL TRASH *~</div>

    <div class="counter">VISITE GRATIS: 009841</div>

    <div class="screen" id="screen">
        1. TOPOLONA<br>
        2. CRAZY FROG<br>
        3. DRAGOSTEA DIN TEI<br>
        4. THE KETCHUP SONG<br>
        <span class="blink">> SELEZIONA SUONERIA (1-4)...</span>
    </div>

    <div class="keypad">
        <button onclick="pressKey('1')">1</button>
        <button onclick="pressKey('2')">2</button>
        <button onclick="pressKey('3')">3</button>
        <button onclick="pressKey('4')">4</button>
        <button onclick="pressKey('5')">5</button>
        <button onclick="pressKey('6')">6</button>
        <button onclick="pressKey('7')">7</button>
        <button onclick="pressKey('8')">8</button>
        <button onclick="pressKey('9')">9</button>
        <button onclick="clearScreen()">C</button>
        <button onclick="pressKey('0')">0</button>
        <button onclick="triggerAction()">#</button>
    </div>

    <button class="btn-action" onclick="triggerAction()">GENERA SQUILLO 🚀</button>

    <div class="preview-box" id="previewBox">
        <div style="font-size: 13px; margin-bottom: 5px; color: #ffff00;" class="blink">PACCHETTO PRONTO! 📱</div>
        <div id="smsText" style="font-size: 13px; margin-bottom: 8px; text-align: left; background: #000040; padding: 5px; border: 1px solid #00ff00;"></div>
        <img id="previewGif" src="" alt="GIF Trash">
        <audio id="previewAudio" controls style="width: 100%; margin-top: 8px;"></audio>
        
        <!-- Pulsante per l'invio dell'SMS reale tramite il telefono -->
        <a id="smsLinkButton" class="sms-btn" href="#" target="_blank">INVIA VERO SMS ORA 📤</a>
    </div>
</div>

<script>
    let step = 1;
    let ringtoneChoice = "";
    let phoneNumber = "";

    const ringtonesData = {
        "1": { name: "Topolona", mp3: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
        "2": { name: "Crazy Frog", mp3: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
        "3": { name: "Dragostea Din Tei", mp3: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
        "4": { name: "The Ketchup Song", mp3: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" }
    };

    const trashGifs = [
        "https://media.giphy.com/media/3o7TKSjRrfIPjeiVyM/giphy.gif",
        "https://media.giphy.com/media/l0HlRnAWXxn0MhOBK/giphy.gif",
        "https://media.giphy.com/media/10VxA3X7rC3W2s/giphy.gif",
        "https://media.giphy.com/media/Ju7l5y9osyymQ/giphy.gif"
    ];

    function pressKey(num) {
        let screen = document.getElementById("screen");
        if (step === 1) {
            ringtoneChoice = num;
            let name = ringtonesData[num] ? ringtonesData[num].name : "Personalizzata";
            screen.innerHTML = `HAI SCELTO: ${name}<br><br>DIGITA N. CELLULARE E PREMI #`;
            step = 2;
        } else {
            phoneNumber += num;
            screen.innerHTML = `SCELTA: ${ringtoneChoice}<br>CELL: ${phoneNumber}_`;
        }
    }

    function clearScreen() {
        step = 1;
        ringtoneChoice = "";
        phoneNumber = "";
        document.getElementById("screen").innerHTML = `1. TOPOLONA<br>2. CRAZY FROG<br>3. DRAGOSTEA<br>4. KETCHUP<br><span class="blink">> SELEZIONA SUONERIA (1-4)...</span>`;
        document.getElementById("previewBox").style.display = "none";
    }

    function triggerAction() {
        if (step === 2 && phoneNumber.length > 3) {
            let screen = document.getElementById("screen");
            screen.innerHTML = `<span class="blink">ELABORAZIONE PACCHETTO WAP... 💾</span>`;

            setTimeout(() => {
                let selectedSong = ringtonesData[ringtoneChoice] || ringtonesData["1"];
                let randomGif = trashGifs[Math.floor(Math.random() * trashGifs.length)];

                screen.innerHTML = `FATTO! PACCHETTO PRONTO PER<br>${phoneNumber} ✨`;
                
                let messageBody = `JUMBO SQUILLO! Ecco la tua suoneria ${selectedSong.name}! Ascolta: ${selectedSong.mp3} - GIF: ${randomGif}`;
                
                document.getElementById("smsText").innerHTML = `<b>Testo SMS:</b> ${messageBody}`;
                document.getElementById("previewGif").src = randomGif;
                document.getElementById("previewAudio").src = selectedSong.mp3;
                
                // Configura il link nativo sms: del telefono per l'invio reale gratuito
                let smsButton = document.getElementById("smsLinkButton");
                smsButton.href = `sms:${phoneNumber}?body=${encodeURIComponent(messageBody)}`;
                smsButton.style.display = "block";

                document.getElementById("previewBox").style.display = "block";
            }, 1200);
        } else {
            alert("Seleziona una suoneria e inserisci il numero di telefono!");
        }
    }
</script>

</body>
</html>
