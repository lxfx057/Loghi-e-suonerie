<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUMBO SOUND - WAP & WEB RINGTONES 2000</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap');

        body {
            background-color: #000080;
            background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
            color: #00ff00;
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .marquee-container {
            background: #ffff00;
            color: #ff0000;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            padding: 8px;
            border: 2px dashed #ff00ff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #c0c0c0;
            border: 4px outset #ffffff;
            padding: 15px;
            color: #000000;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            color: #ff00ff;
            text-shadow: 2px 2px #00ffff, 4px 4px #ff0000;
            transform: skew(-5deg);
            margin-bottom: 5px;
        }

        .sub-title {
            font-size: 13px;
            color: #800080;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .screen {
            background: #ffffff;
            border: 3px inset #808080;
            padding: 10px;
            min-height: 120px;
            margin-bottom: 15px;
            font-size: 16px;
            text-align: left;
            color: #000;
            line-height: 1.3;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        button {
            background: #dfdfdf;
            border: 3px outset #ffffff;
            font-family: 'VT323', monospace;
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
            cursor: pointer;
            color: #000;
        }

        button:active {
            border: 3px inset #ffffff;
            background: #cfcfcf;
        }

        .btn-action {
            background: #ff00ff;
            color: #ffff00;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            width: 100%;
            padding: 12px;
            border: 3px outset #ffff00;
            cursor: pointer;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .blink {
            animation: blinker 0.6s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="marquee-container">
    <marquee>*** SELECT RINGTONE, ENTER NUMBER & SEND SMS WITH DIRECT DOWNLOAD MP3 LINK! ***</marquee>
</div>

<div class="container">
    <h1>JUMBO TONE 2000</h1>
    <div class="sub-title">~* DIRECT MP3 SMS SENDER *~</div>

    <div class="screen" id="screen">
        1. Topolona<br>
        2. Axel F (Crazy Frog)<br>
        3. La Pulce (Virgola)<br>
        4. Dragostea Din Tei<br>
        5. The Ketchup Song<br>
        6. Super Mario Theme<br>
        <span class="blink">> STEP 1: PRESS N. (1-6)...</span>
    </div>

    <div class="keypad">
        <button onclick="pressKey('1')">1</button>
        <button onclick="pressKey('2')">2</button>
        <button onclick="pressKey('3')">3</button>
        <button onclick="pressKey('4')">4</button>
        <button onclick="pressKey('5')">5</button>
        <button onclick="pressKey('6')">6</button>
        <button onclick="pressKey('7')">7</button>
        <button onclick="pressKey('8')">8</button>
        <button onclick="pressKey('9')">9</button>
        <button onclick="clearScreen()">C</button>
        <button onclick="pressKey('0')">0</button>
        <button onclick="pressKey('#')">#</button>
    </div>

    <button class="btn-action" style="background: #00ff00; color: #000;" onclick="sendSMS()">SEND SMS WITH MP3 LINK 🚀</button>
</div>

<script>
    let currentStep = 1; 
    let selectedChoice = "";
    let recipientPhone = "";

    const ringtonesData = {
        "1": { name: "Topolona", mp3: "https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Topolona&filename=mz/MzMxNjI5ODc3MzMxNjI5_XlU4R2F0SGIuA.mp3" },
        "2": { name: "Axel F (Crazy Frog)", mp3: "https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Crazy+Frog+Axel+F&filename=24/24294025-27a9-4674-84c2-9e32a67eeb39.mp3" },
        "3": { name: "La Pulce (Virgola)", mp3: "https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=La+Pulce+Aquatica&filename=25/25442562-b9cf-4fd3-b883-999081e7d23d.mp3" },
        "4": { name: "Dragostea Din Tei", mp3: "https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Dragostea+Din+Tei&filename=31/31801261-26c7-43c3-8889-ff371b26bc6a.mp3" },
        "5": { name: "The Ketchup Song", mp3: "https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=The+Ketchup+Song&filename=36/36254190-2e4d-4e94-a90f-90db2077e6f9.mp3" },
        "6": { name: "Super Mario Theme", mp3: "https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Super+Mario+Bros&filename=20/20348701-4475-4785-b9f1-a1e649033324.mp3" }
    };

    function pressKey(num) {
        let screen = document.getElementById("screen");
        
        if (currentStep === 1) {
            if (ringtonesData[num]) {
                selectedChoice = num;
                let songName = ringtonesData[num].name;
                screen.innerHTML = `SELECTED: [${num}] ${songName}<br><br>STEP 2: TYPE PHONE & PRESS #`;
                currentStep = 2;
            } else {
                alert("Please select a valid number from 1 to 6!");
            }
        } else {
            if (num === '#') {
                sendSMS();
                return;
            }
            recipientPhone += num;
            let songName = ringtonesData[selectedChoice].name;
            screen.innerHTML = `RINGTONE: ${songName}<br>PHONE: ${recipientPhone}_<br><br>(Press # or SMS button)`;
        }
    }

    function sendSMS() {
        if (!selectedChoice || recipientPhone.length < 3) {
            alert("Please select a ringtone (1-6) and enter a phone number first!");
            return;
        }

        let song = ringtonesData[selectedChoice];
        let smsText = encodeURIComponent(`Get your ringtone ${song.name}! Download MP3 directly here: ${song.mp3}`);
        
        let screen = document.getElementById("screen");
        screen.innerHTML = `OPENING MESSAGES APP...<br>TO: ${recipientPhone} ✨`;

        window.location.href = `sms:${recipientPhone}?body=${smsText}`;
    }

    function clearScreen() {
        currentStep = 1;
        selectedChoice = "";
        recipientPhone = "";
        document.getElementById("screen").innerHTML = `1. Topolona<br>2. Axel F (Crazy Frog)<br>3. La Pulce (Virgola)<br>4. Dragostea Din Tei<br>5. The Ketchup Song<br>6. Super Mario Theme<br><span class="blink">> STEP 1: PRESS N. (1-6)...</span>`;
    }
</script>

</body>
</html>
