<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUMBO SOUND - WAP & WEB RINGTONES 2000</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap');

        body {
            background-color: #000080;
            background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
            color: #00ff00;
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .marquee-container {
            background: #ffff00;
            color: #ff0000;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            padding: 8px;
            border: 2px dashed #ff00ff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #c0c0c0;
            border: 4px outset #ffffff;
            padding: 15px;
            color: #000000;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            color: #ff00ff;
            text-shadow: 2px 2px #00ffff, 4px 4px #ff0000;
            transform: skew(-5deg);
            margin-bottom: 5px;
        }

        .sub-title {
            font-size: 13px;
            color: #800080;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .screen {
            background: #ffffff;
            border: 3px inset #808080;
            padding: 10px;
            min-height: 120px;
            margin-bottom: 15px;
            font-size: 16px;
            text-align: left;
            color: #000;
            line-height: 1.3;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        button {
            background: #dfdfdf;
            border: 3px outset #ffffff;
            font-family: 'VT323', monospace;
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
            cursor: pointer;
            color: #000;
        }

        button:active {
            border: 3px inset #ffffff;
            background: #cfcfcf;
        }

        .btn-action {
            background: #ff00ff;
            color: #ffff00;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            width: 100%;
            padding: 12px;
            border: 3px outset #ffff00;
            cursor: pointer;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .preview-box {
            margin-top: 15px;
            border: 2px solid #ff0000;
            background: #000;
            padding: 8px;
            display: none;
            color: #00ff00;
        }

        .preview-box img {
            max-width: 100%;
            height: auto;
            border: 1px dashed #00ff00;
            margin-top: 5px;
        }

        .blink {
            animation: blinker 0.6s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="marquee-container">
    <marquee>*** PORTALE WAP AUTOMATICO: SCEGLI, DIGITA IL NUMERO E INVIA I FILE MP3 + GIF! ***</marquee>
</div>

<div class="container">
    <h1>JUMBO TONE 2000</h1>
    <div class="sub-title">~* AUTOMAZIONE MOBILE *~</div>

    <div class="screen" id="screen">
        1. Topolona<br>
        2. Axel F (Crazy Frog)<br>
        3. La Pulce (Virgola)<br>
        4. Dragostea Din Tei<br>
        5. The Ketchup Song<br>
        6. Super Mario Theme<br>
        <span class="blink">> STEP 1: DIGITA N. (1-6)...</span>
    </div>

    <div class="keypad">
        <button onclick="pressKey('1')">1</button>
        <button onclick="pressKey('2')">2</button>
        <button onclick="pressKey('3')">3</button>
        <button onclick="pressKey('4')">4</button>
        <button onclick="pressKey('5')">5</button>
        <button onclick="pressKey('6')">6</button>
        <button onclick="pressKey('7')">7</button>
        <button onclick="pressKey('8')">8</button>
        <button onclick="pressKey('9')">9</button>
        <button onclick="clearScreen()">C</button>
        <button onclick="pressKey('0')">0</button>
        <button onclick="pressKey('#')">#</button>
    </div>

    <button class="btn-action" style="background: #00ff00; color: #000;" onclick="runAutomationAndSend()">AVVIA AUTOMAZIONE E INVIA FILE 🚀</button>

    <div class="preview-box" id="previewBox">
        <div style="font-size: 13px; margin-bottom: 5px; color: #ffff00;" id="statusMsg" class="blink">ELABORAZIONE...</div>
        <div id="detailsDisplay" style="font-size: 13px; margin-bottom: 8px; text-align: left; background: #000040; padding: 6px; border: 1px solid #00ff00;"></div>
        <audio id="previewAudio" controls style="width: 100%; margin-bottom: 5px;"></audio>
        <img id="previewGif" src="" alt="GIF Trash">
    </div>
</div>

<script>
    let currentStep = 1; 
    let selectedChoice = "";
    let recipientPhone = "";

    const ringtonesData = {
        "1": { name: "Topolona", mp3: "https://www.myinstants.com/media/sounds/topolona.mp3" },
        "2": { name: "Axel F (Crazy Frog)", mp3: "https://www.myinstants.com/media/sounds/crazy-frog.mp3" },
        "3": { name: "La Pulce (Virgola)", mp3: "https://www.myinstants.com/media/sounds/virgola-pulce.mp3" },
        "4": { name: "Dragostea Din Tei", mp3: "https://www.myinstants.com/media/sounds/numa-numa_1.mp3" },
        "5": { name: "The Ketchup Song", mp3: "https://www.myinstants.com/media/sounds/asereje.mp3" },
        "6": { name: "Super Mario Theme", mp3: "https://www.myinstants.com/media/sounds/super-mario-bros.mp3" }
    };

    const trashGifs = [
        "https://media.giphy.com/media/3o7TKSjRrfIPjeiVyM/giphy.gif",
        "https://media.giphy.com/media/l0HlRnAWXxn0MhOBK/giphy.gif",
        "https://media.giphy.com/media/10VxA3X7rC3W2s/giphy.gif",
        "https://media.giphy.com/media/Ju7l5y9osyymQ/giphy.gif"
    ];

    function pressKey(num) {
        let screen = document.getElementById("screen");
        
        if (currentStep === 1) {
            if (ringtonesData[num]) {
                selectedChoice = num;
                let songName = ringtonesData[num].name;
                screen.innerHTML = `HAI SCELTO: [${num}] ${songName}<br><br>STEP 2: DIGITA CELLULARE E PREMI #`;
                currentStep = 2;
            } else {
                alert("Seleziona un numero valido da 1 a 6!");
            }
        } else {
            if (num === '#') {
                runAutomationAndSend();
                return;
            }
            recipientPhone += num;
            let songName = ringtonesData[selectedChoice].name;
            screen.innerHTML = `SUONERIA: ${songName}<br>CELL: ${recipientPhone}_<br><br>(Premi # o il bottone per inviare)`;
        }
    }

    async function runAutomationAndSend() {
        if (!selectedChoice || recipientPhone.length < 3) {
            alert("Seleziona prima la suoneria (1-6) e inserisci il numero di telefono!");
            return;
        }

        let screen = document.getElementById("screen");
        screen.innerHTML = `<span class="blink">BACKGROUND: DOWNLOAD MP3 & GIF... 💾</span>`;

        let song = ringtonesData[selectedChoice];
        let randomGif = trashGifs[Math.floor(Math.random() * trashGifs.length)];

        try {
            // Scarica i file binari reali per prepararli all'invio nativo
            let mp3Blob = await fetch(song.mp3).then(r => r.blob());
            let gifBlob = await fetch(randomGif).then(r => r.blob());

            let mp3File = new File([mp3Blob], `${song.name}.mp3`, { type: "audio/mp3" });
            let gifFile = new File([gifBlob], `trash_animata.gif`, { type: "image/gif" });

            screen.innerHTML = `AUTOMAZIONE COMPLETATA!<br>INVIO A: ${recipientPhone} 🚀`;

            // Mostra l'anteprima sul display retrò
            let box = document.getElementById("previewBox");
            document.getElementById("statusMsg").innerText = "FILE PRONTI PER L'INVIO!";
            document.getElementById("detailsDisplay").innerHTML = `<b>Destinatario:</b> ${recipientPhone}<br><b>File:</b> ${song.name}.mp3 + GIF`;
            document.getElementById("previewAudio").src = song.mp3;
            document.getElementById("previewGif").src = randomGif;
            box.style.display = "block";

            // Attiva la condivisione nativa del telefono con i file reali allegati
            if (navigator.canShare && navigator.canShare({ files: [mp3File, gifFile] })) {
                await navigator.share({
                    title: 'Jumbo Tone 2000',
                    text: `Ecco la suoneria ${song.name} per il numero ${recipientPhone}!`,
                    files: [mp3File, gifFile]
                });
            } else {
                alert("Il browser ha elaborato i file, ma la condivisione diretta richiede l'apertura del menu di sistema.");
            }
        } catch (error) {
            console.log("Errore automazione:", error);
            alert("Elaborazione completata. Usa i comandi di riproduzione sottostanti.");
        }
    }

    function clearScreen() {
        currentStep = 1;
        selectedChoice = "";
        recipientPhone = "";
        document.getElementById("screen").innerHTML = `1. Topolona<br>2. Axel F (Crazy Frog)<br>3. La Pulce (Virgola)<br>4. Dragostea Din Tei<br>5. The Ketchup Song<br>6. Super Mario Theme<br><span class="blink">> STEP 1: DIGITA N. (1-6)...</span>`;
        document.getElementById("previewBox").style.display = "none";
        document.getElementById("previewAudio").pause();
    }
</script>

</body>
</html>
